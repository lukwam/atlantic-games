[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantic-games"
dynamic = ["version"]
description = "Unofficial Python client for The Atlantic's games: Bracket City, the Crossword, Caleb's Inferno, Rabbithole, Trivia and Stacks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Karlsson", email = "lukwam@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "atlantic",
    "the-atlantic",
    "games",
    "bracket-city",
    "crossword",
    "rabbithole",
    "trivia",
    "amuse-labs",
    "puzzleme",
    "puzzles",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=2.3"]
cli = [
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
]
test = ["fastapi>=0.111", "ipuz", "puzpy", "pytest", "pyyaml>=6", "pytest-asyncio", "pytest-cov", "respx", "rich>=13", "ruff", "typer>=0.12", "xmlschema", "mcp>=2.3"]

[project.scripts]
atlg = "atlgames.cli:main"
atlg-mcp = "atlgames.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/lukwam/atlantic-games"
Issues = "https://github.com/lukwam/atlantic-games/issues"
Releases = "https://github.com/lukwam/atlantic-games/releases"
Changelog = "https://github.com/lukwam/atlantic-games/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlgames = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "atlgames.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits The Atlantic and Amuse Labs over the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-single-line = true
